# Keeps the free Render backend awake by calling /health every 10 minutes.
# Delete this file (or disable the workflow in the Actions tab) when the study is over.
name: keep-backend-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /health (waits up to 90 s in case the server is waking up)
        run: curl -fsS --retry 2 --retry-delay 5 --max-time 90 https://langogo.onrender.com/health
